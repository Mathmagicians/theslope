name: Node and dependencies
description: Node from package.json, npm ci, and Chromium for Playwright when browsers is true
inputs:
  browsers:
    description: Install Chromium for Playwright
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
    - run: npm ci
      shell: bash
    - if: inputs.browsers == 'true'
      run: npx playwright install chromium
      shell: bash
