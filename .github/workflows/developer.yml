name: Developer companion

on:
  workflow_run:
    workflows: ["The CI/CD Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The CI/CD run to publish again'
        required: true
        type: string

concurrency:
  group: developer-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Read what the run published
        run: make developer-resolve run="${{ inputs.run_id || github.event.workflow_run.id }}" | tee -a "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        if: env.PUBLISH == 'true'
        with:
          node-version-file: 'package.json'
      - run: npm ci
        if: env.PUBLISH == 'true'
      - name: Checkout the published site
        if: env.PUBLISH == 'true'
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: .output/developer/site
          fetch-depth: 1
      - name: Download the suite results and the API spec
        if: env.PUBLISH == 'true'
        run: |
          for name in playwright-results-api playwright-results-ui playwright-results-smoke bdd-api bdd-ui bdd-smoke openapi; do
            gh run download "$RUN_ID" -n "$name" -D ".output/developer/artifacts/$name" || echo "no $name artifact on run $RUN_ID"
          done
      - run: make developer-assemble env="$ENV" run="$RUN_ID" version="$RELEASE_VERSION" sha="$COMMIT_SHA" url="$URL"
        if: env.PUBLISH == 'true'
      - run: make developer-build
        if: env.PUBLISH == 'true'
      - run: make developer-publish env="$ENV"
        if: env.PUBLISH == 'true'
